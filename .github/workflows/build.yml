name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven test selector (e.g. -pl gson -Dtest=JsonReaderTest)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -DfailIfNoTests=false ${{ inputs.test-filter }}
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests
        run: |
          for f in $(find . -path '*/target/surefire-reports/TEST-*.xml'); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              s = tc.find('skipped')
              if s is not None:
                  print('SKIPPED: %s.%s - %s' % (tc.get('classname'), tc.get('name'), s.get('message') or 'assumption not met (org.junit.Assume)'))
          PY
          done
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
